<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1c1c" />
    <meta
      name="description"
      content="Find the moment a concept was taught. Search your DSA lectures and revisit explanations with timestamped sources."
    />
    <link
      rel="preload"
      href="/fonts/dm-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      html {
        background: #1c1c1c;
        color-scheme: dark;
      }
      html[data-theme="light"] {
        background: #f7f4ed;
        color-scheme: light;
      }
    </style>
    <script>
      try {
        const theme = localStorage.getItem("recallq.theme");
        if (theme === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').content =
            "#f7f4ed";
        }
      } catch {}
    </script>
    <title>RecallQ — Find where you learned it</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
