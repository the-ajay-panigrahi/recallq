[project]
name = "recallq"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28", "python-dotenv>=1.0", "onnxruntime>=1.20,<2", "numpy>=2,<3", "tokenizers>=0.21,<0.24"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
audit = ["silero-vad>=6.2.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]
baseline = ["faster-whisper==1.2.1", "av==16.1.0", "yt-dlp>=2025.10.22", "uroman>=1.3.1", "imageio-ffmpeg>=0.6"]
transcription = [
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "yt-dlp>=2025.10.22",
    "imageio-ffmpeg>=0.6",
    "uroman>=1.3.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "python3 -m scripts.prepare_embeddings && npm ci && npm run build"
