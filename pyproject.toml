[project]
name = "recallq"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28", "python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "npm ci && npm run build"
